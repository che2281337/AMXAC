// =============================================================================
//  AMXAC — anti-cheat settings
//  (Russian version of this file with the same settings: configs/ru/amxac.cfg)
// =============================================================================
//
//  How to read this file:
//    - a line like  amxac_xxx  value  is a setting, change only the value;
//    - everything after // is a comment, the server ignores it;
//    - times are in MINUTES unless stated otherwise. Cheat sheet:
//        60 = 1 hour,  1440 = 1 day,  10080 = 1 week,  43200 = 30 days,  0 = forever;
//    - after editing: change the map or restart the server.
//
//  How the anti-cheat works, in short:
//    Detectors don't ban on their own. Every suspicious action gives the player
//    "points". Points burn off over time. Collect many and a level fires:
//      WARN   (30 points)  — "keep an eye on him";
//      ALERT  (60 points)  — "most likely a cheater";
//      ACTION (100 points) — "definitely a cheater".
//    What to do at each level (nothing / mute / kick / ban) is up to you, below.
//
//  TIP: for the first week leave every punishment at "none" and set
//  amxac_notify_reports 1. Read the logs (addons/amxmodx/logs/amxac_*.log),
//  make sure honest players aren't caught, and only then enable bans.
// =============================================================================


// -----------------------------------------------------------------------------
//  1. PUNISHMENTS — what to do at each level
// -----------------------------------------------------------------------------
//  Options: "none", "mute", "kick", "ban"

amxac_punish_warn       "none"      // at 30 points
amxac_punish_alert      "none"      // at 60 points   (e.g. "mute")
amxac_punish_action     "none"      // at 100 points  (e.g. "ban")

// --- Ban length (minutes, 0 = forever) ---
amxac_punish_ban_time         10080   // common ban length: 1 week
// Own length for a single level. -1 = use the common one (line above).
amxac_punish_ban_time_warn    -1
amxac_punish_ban_time_alert   -1      // e.g. 1440 = one-day ban
amxac_punish_ban_time_action  -1      // e.g. 0 = forever

// --- Mute length (minutes, 0 = until map change) ---
amxac_punish_mute_time         30     // common mute length
amxac_punish_mute_time_warn    -1     // -1 = use the common one
amxac_punish_mute_time_alert   -1
amxac_punish_mute_time_action  -1

// --- When to kick/ban ---
// Kicks and bans aren't immediate, so a cheater can't tell what gave him away.
amxac_punish_round_end   1      // 1 = at the end of the round, 0 = after a random delay
amxac_punish_delay_min   30     // delay FROM (seconds), if round_end is 0
amxac_punish_delay_max   120    // delay UP TO (seconds); also the longest wait for a round end
// Admins see in chat that a punishment is scheduled and can cancel it:  amx_ac_cancel <name>

// --- Texts ---
// Colors: !g green, !t team color, !n normal.  %name% = player name, %time% = length.
amxac_punish_reason     "Cheating"   // reason the player sees on kick/ban
amxac_punish_announce   1            // 1 = tell everyone in chat about kicks/bans, 0 = silent
amxac_punish_msg_kick   "!g[AC]!n !t%name%!n was kicked by the anti-cheat."
amxac_punish_msg_ban    "!g[AC]!n !t%name%!n was banned by the anti-cheat (%time%)."
amxac_punish_msg_mute   "!g[AC]!n You are muted (%time%)."

// --- Who is NOT punished ---
// Admin flags to leave alone (they're only logged). "" = punish everyone.
// E.g. "a" — everyone with flag a is immune.
amxac_punish_immunity   ""

// --- Your own ban system (AMXBans, Fresh Bans, ...) ---
// Empty = the server's own ban (banid by SteamID, or by IP for non-Steam).
// Placeholders: %userid% %name% %steamid% %ip% %time% %reason% %module%
// Example for AMXBans (check the syntax of your system!):
//   amxac_punish_ban_cmd "amx_ban %time% #%userid% %reason%"
amxac_punish_ban_cmd     ""
// Ban for someone who left while a ban was pending (no %userid% possible here).
// Empty = the server's own ban by SteamID/IP.
amxac_punish_offline_cmd ""
// Your own kick command. Empty = plain kick.
amxac_punish_kick_cmd    ""


// -----------------------------------------------------------------------------
//  2. LEVELS AND POINTS
// -----------------------------------------------------------------------------

amxac_warn          30      // points for WARN
amxac_alert         60      // points for ALERT (admins get a chat message)
amxac_action        100     // points for ACTION
amxac_halflife      120     // how many SECONDS it takes for points to halve

amxac_admin_flag     "d"    // which admins get chat notifications
amxac_immunity_flag  ""     // who isn't checked at all ("" = check everyone, admins too)
amxac_notify_reports 0      // 1 = send admins EVERY suspicion (handy while tuning)
amxac_log            1      // 1 = write everything to logs/amxac_YYYYMMDD.log
amxac_include_bots   0      // 1 = check bots too (testing only)
amxac_debug          0      // 1 = tell the player in console why a detector fired or not (rcon-flag players only; testing)

// Old way to punish: one command at the ACTION level.
// If you use amxac_punish_* above, leave it empty, or it fires twice.
amxac_action_cmd    ""


// -----------------------------------------------------------------------------
//  3. WALLHACK AND NO-FLASH PROTECTION
// -----------------------------------------------------------------------------
//  Doesn't catch, it prevents: the server simply doesn't tell the player where
//  enemies behind walls are.

amxac_awh_enabled   1       // 1 = don't show enemies behind walls (WH, radar protection)
amxac_awh_flash     1       // 1 = don't show enemies while the player is flashed
amxac_awh_teammates 0       // 1 = hide teammates behind walls too

// CPU load. If the server starts lagging, raise interval to 0.15–0.2.
amxac_awh_interval      0.1     // how often visibility is rechecked (seconds)
amxac_awh_grace         0.3     // keep showing an enemy this long after he's out of sight (seconds)
amxac_awh_max_latency   0.25    // ping compensation, at most (seconds)
amxac_awh_traces        20000   // trace limit per second for the whole server

// Sound ESP protection (amxac_antiesp, needs ReAPI). Enemies you can't see are
// heard from the right direction and loudness, but not from their real spot.
amxac_esp_enabled       1       // 1 = fake the position of hidden enemies' sounds
amxac_esp_fake_dist     250     // their sounds are moved to this distance from you, units
amxac_esp_events        1       // 1 = hide gunshot events from enemies who can't see the shooter
amxac_esp_teammates     0       // 1 = fake teammates' sounds too


// -----------------------------------------------------------------------------
//  4. SERVER ACCESS
// -----------------------------------------------------------------------------

amxac_misc_dup_steamid    1     // 1 = kick a second player with the same SteamID (emulators)
amxac_misc_blocked_reason "Your IP is blocked on this server"   // kick text for blacklisted IPs
// The blacklist itself is amxac_blocked_ips.ini, or the commands
//   amx_ac_blockip 1.2.3.4   /   amx_ac_blockip 1.2.3.0/24   /   amx_ac_unblockip ...

amxac_misc_max_per_ip     3     // how many players from one IP is normal (0 = don't check)


// -----------------------------------------------------------------------------
//  5. TURNING DETECTORS ON AND OFF
// -----------------------------------------------------------------------------
//  1.0 = normal,  0 = off,  0.5 = half the points,  2.0 = double.

// Aim
amxac_w_silentaim   1.0     // silent aim (the bullet goes to the enemy, the crosshair doesn't)
amxac_w_aimsnap     1.0     // sudden snap to the head
amxac_w_trigger     1.0     // triggerbot (fires when an enemy is under the crosshair)
amxac_w_tracking    1.0     // tracking through walls, aim lock, headshot ratio
amxac_w_nospread    1.0     // no spread
amxac_w_norecoil    1.0     // no recoil
amxac_w_knifebot    1.0     // automatic knife
amxac_w_fastzoom    1.0     // fast-zoom script on snipers
amxac_w_rapidfire   1.0     // pistol autoclicker
amxac_w_noflash     1.0     // hits while flashed

// Movement
amxac_w_bhop        1.0     // bhop script.  SET 0 if the server has autobhop!
amxac_w_sgs         1.0     // SGS / ducktap script (perfect ducktaps).  Better 0 on KZ
amxac_w_strafe      1.0     // auto-strafe and strafe helper
amxac_w_speedhack   1.0     // speedhack
amxac_w_angles      1.0     // anti-aim and spinbot
amxac_w_netcode     1.0     // fakelag (weak signal)
amxac_w_movecheck   1.0     // forged movement: against the key held, faster than maxspeed

// Other
amxac_w_misc        1.0     // name flood, many players from one IP
amxac_w_cvars       1.0     // forbidden client settings (amxac_cvars.ini), cvar query blockers
amxac_w_history     1.0     // points on join for players caught before
amxac_w_honeypot    1.0     // trap: shoots at or tracks the invisible admin (amx_ac_ghost)


// =============================================================================
//  6. FINE-TUNING THE DETECTORS
// =============================================================================
//  Change only if a detector catches honest players (raise the threshold) or
//  catches nothing (lower it). *_pts = points for one detection.
// =============================================================================

// --- silent aim ---
amxac_silent_min_flick   15     // minimum flick, degrees
amxac_silent_return_eps  1.0    // how exactly the aim must return, degrees
amxac_silent_hold_eps    0.5
amxac_silent_max_hold    2      // how many frames the cheat may hold the flick
amxac_silent_pts         25
amxac_silent_raw_attack  1      // 1 = count held +attack as a shot (needed with Unreal Aim Blocker)

// --- snap to the head ---
amxac_snap_min   20     // snap, degrees
amxac_snap_stop  0.3    // how still the aim must be afterwards, degrees
amxac_snap_pts   5

// --- triggerbot ---
amxac_trig_instant_ms    15     // a shot this soon after the enemy appears = "instant", ms
amxac_trig_instant_need  5      // instant ones out of 10 to be suspicious
amxac_trig_max_rt        1000
amxac_trig_max_std       8      // reaction spread below this many ms = bot with a delay
amxac_trig_max_mean      400
amxac_trig_pts_instant   20
amxac_trig_pts_const     15

// --- tracking through walls / aim lock / headshots ---
amxac_track_fov          3      // how close the aim is to the enemy, degrees
amxac_track_min_dist     150
amxac_track_wall_ms      600    // how long the enemy is followed behind a wall, ms
amxac_track_wall_travel  10
amxac_track_wall_pts     6
amxac_track_wall_err     1.2    // mean aim error on the hidden enemy must be below this (tracking by sound is rough)
amxac_track_lock_ms      250
amxac_track_lock_travel  15
amxac_track_lock_std     0.25
amxac_track_lock_pts     4
amxac_track_hs_need      17     // headshots out of the last 20 kills
amxac_track_hs_pts       8

// --- no spread ---
amxac_nospread_min_dev   0.3
amxac_nospread_ratio     0.25
amxac_nospread_need      8      // suspicious shots out of 10
amxac_nospread_pts       20

// --- no recoil ---
amxac_norecoil_min_shots 6      // minimum shots in a spray
amxac_norecoil_min_punch 1.0    // recoil must reach at least this many degrees
amxac_norecoil_max_drift 0.25
amxac_norecoil_pts       12

// --- knife ---
amxac_knife_range        64
amxac_knife_instant_ms   15
amxac_knife_need         7      // instant swings out of 10
amxac_knife_pts          15

// --- fast zoom ---
amxac_zoom_fast_ms       40     // a shot this soon after zooming, ms
amxac_zoom_need          3      // such shots out of 6
amxac_zoom_pts           12

// --- autoclicker ---
amxac_rapid_max_interval 300
amxac_rapid_max_std      2.5    // clicks more even than this many ms = script
amxac_rapid_pts          10

// --- shooting while flashed ---
amxac_flash_need         3      // aimed hits during one flash
amxac_flash_pts          10

// --- bhop ---
amxac_bhop_streak        10     // perfect jumps in a row
amxac_bhop_clean_streak  6      // perfect jumps in a row without presses in the air
amxac_bhop_ratio         0.8    // share of perfect ones out of the last 30
amxac_bhop_pts_streak    8
amxac_bhop_pts_clean     15
amxac_bhop_pts_ratio     6

// --- SGS / ducktaps (same as bhop, for duck) ---
amxac_sgs_streak         10     // perfect ducktaps in a row
amxac_sgs_clean_streak   6      // perfect ducktaps in a row without duck presses in the air
amxac_sgs_ratio          0.8    // share of perfect ones out of the last 30
amxac_sgs_pts_streak     8
amxac_sgs_pts_clean      15
amxac_sgs_pts_ratio      6

// --- jump/duck macros (AHK and the like, press the button on a timer) ---
// Catches button spam at a constant interval, not tied to landing.
// Points go to bhop (jump) or sgs (duck).
amxac_macro_rate         25     // presses per second from which it's "spam"
amxac_macro_seconds      3      // this many seconds in a row
amxac_macro_cv           0.4    // interval spread (0 = perfectly even); hands are usually > 0.5
amxac_macro_pts          10

// --- strafes ---
amxac_strafe_air_window  200
amxac_strafe_auto_ratio  0.5
amxac_strafe_switch_window 40   // A/D switches per strafe-helper check
amxac_strafe_switch_exact  0.9  // share of key switches exactly on the mouse reversal frame (0.9 = 90%); humans are usually 20-40%
amxac_strafe_pts_auto    15
amxac_strafe_pts_sync    10

// --- speedhack ---
amxac_speed_tolerance    300    // how many ms the client may "run ahead"
amxac_speed_credit       1000
amxac_speed_pts          10
// fake commands (msec = 0): the cheat sends frames that cost no time
amxac_zero_streak        3      // this many such frames in a row = one "burst"
amxac_zero_need          3      // bursts per window to fire
amxac_zero_window        5      // window, seconds
amxac_zero_pts           15

// --- forged movement ---
amxac_move_window        200    // moving frames per check
amxac_move_sign_need     3      // "moving against the key held" frames to fire
amxac_move_over_ratio    0.2    // share of frames faster than maxspeed (0.2 = 20%)
amxac_move_pts_sign      15
amxac_move_pts_over      10

// --- angles and spinbot ---
amxac_angles_max_pitch   89.9
amxac_angles_pts         20
amxac_spin_deg           2000   // turning, degrees per second
amxac_spin_seconds       2      // this many seconds in a row
amxac_spin_pts           20

// --- fakelag ---
amxac_net_batch          12
amxac_net_need           8
amxac_net_window         10
amxac_net_pts            5
// lag shot: the cheat "lags" right at the moment of the shot
amxac_lagshot_window     20     // shots per check
amxac_lagshot_shot_ratio 0.5    // share of shots in choked packets to fire
amxac_lagshot_cmd_ratio  0.15   // ...while no more than this share of other frames is in them
amxac_lagshot_pts        10

// --- name / IP ---
amxac_misc_names         4      // name changes
amxac_misc_name_window   10     // within this many seconds
amxac_misc_name_pts      10
amxac_misc_ip_pts        10

// --- client settings check ---
amxac_cvars_interval     60     // at most once per this many seconds per player
amxac_query_timeout      10     // wait this many seconds for a cvar query answer
amxac_query_need         2      // this many unanswered queries (while playing) = query blocker
amxac_query_pts          15
amxac_query_strict       0      // 1 = also count clients that never answered (Steam-only servers: old p47 clients never answer)

// --- "invisible admin" trap (amx_ac_ghost) ---
amxac_ghost_track_fov    2.5    // aim closer than this many degrees to the ghost = "aiming at him"
amxac_ghost_track_ms     700    // this many ms in a row...
amxac_ghost_track_move   64     // ...while the ghost moved at least this many units
amxac_ghost_track_pts    20
amxac_ghost_shot_fov     1.5    // a shot closer than this many degrees to the ghost = "shooting at him"
amxac_ghost_shots_need   3      // such shots (each a fresh click, not a spray) to fire
amxac_ghost_shots_window 30     // within this many seconds
amxac_ghost_shot_pts     25

// --- history of offences ---
amxac_history_pts        5      // points on join per previous offence
amxac_history_max        25     // but no more than this
amxac_history_expire     30     // forget after this many DAYS
