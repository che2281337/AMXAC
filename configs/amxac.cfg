// =============================================================================
//  AMXAC — настройки античита
// =============================================================================
//
//  Как читать этот файл:
//    - строка вида  amxac_xxx  значение   — это настройка, менять можно только значение;
//    - всё, что после //, — комментарий, сервер его не читает;
//    - время везде в МИНУТАХ, если не написано иначе. Шпаргалка:
//        60 = 1 час,  1440 = 1 день,  10080 = 1 неделя,  43200 = 30 дней,  0 = навсегда;
//    - после правки: смени карту или перезапусти сервер.
//
//  Как работает античит, в двух словах:
//    Детекторы не банят сами. Каждое подозрительное действие даёт игроку «очки».
//    Очки со временем сгорают. Набрал много — срабатывает уровень:
//      WARN   (30 очков)  — «присмотреться»;
//      ALERT  (60 очков)  — «скорее всего читер»;
//      ACTION (100 очков) — «точно читер».
//    Что делать на каждом уровне (ничего / мут / кик / бан) — решаешь ты, ниже.
//
//  СОВЕТ: первую неделю оставь все наказания "none" и включи
//  amxac_notify_reports 1. Посмотри логи (addons/amxmodx/logs/amxac_*.log),
//  убедись, что честных игроков не ловит, и только потом включай баны.
// =============================================================================


// -----------------------------------------------------------------------------
//  1. НАКАЗАНИЯ — что делать на каждом уровне
// -----------------------------------------------------------------------------
//  Варианты: "none" (ничего), "mute" (мут), "kick" (кик), "ban" (бан)

amxac_punish_warn       "none"      // на 30 очках
amxac_punish_alert      "none"      // на 60 очках   (например "mute")
amxac_punish_action     "none"      // на 100 очках  (например "ban")

// --- Время бана (в минутах, 0 = навсегда) ---
amxac_punish_ban_time         10080   // общее время бана: 1 неделя
// Своё время для отдельного уровня. -1 = брать общее (строчка выше).
amxac_punish_ban_time_warn    -1
amxac_punish_ban_time_alert   -1      // например 1440 = бан на день
amxac_punish_ban_time_action  -1      // например 0 = навсегда

// --- Время мута (в минутах, 0 = до смены карты) ---
amxac_punish_mute_time         30     // общее время мута
amxac_punish_mute_time_warn    -1     // -1 = брать общее
amxac_punish_mute_time_alert   -1
amxac_punish_mute_time_action  -1

// --- Когда выполнять кик/бан ---
// Кик и бан выполняются не сразу, чтобы читер не понял, на чём спалился.
amxac_punish_round_end   1      // 1 = в конце раунда, 0 = через случайную задержку
amxac_punish_delay_min   30     // задержка ОТ (секунды), если round_end 0
amxac_punish_delay_max   120    // задержка ДО (секунды); и максимум ожидания конца раунда
// Админы видят в чате, что наказание запланировано, и могут отменить:  amx_ac_cancel <ник>

// --- Тексты ---
// Цвета: !g зелёный, !t цвет команды, !n обычный.  %name% — ник, %time% — срок.
amxac_punish_reason     "Cheating"   // причина, которую видит игрок при кике/бане
amxac_punish_announce   1            // 1 = писать всем в чат о кике/бане, 0 = молча
amxac_punish_msg_kick   "!g[AC]!n !t%name%!n кикнут античитом."
amxac_punish_msg_ban    "!g[AC]!n !t%name%!n забанен античитом (%time%)."
amxac_punish_msg_mute   "!g[AC]!n Ты в муте (%time%)."

// --- Кого НЕ наказывать ---
// Флаги админов, которых не трогать (их только запишут в лог). "" = наказывать всех.
// Например "a" — иммунитет у всех с флагом a.
amxac_punish_immunity   ""

// --- Своя система банов (AMXBans, Fresh Bans и т.п.) ---
// Если пусто — используется обычный бан сервера (banid по SteamID, или по IP для нон-стима).
// Подстановки: %userid% %name% %steamid% %ip% %time% %reason% %module%
// Пример для AMXBans (сверь синтаксис со своей системой!):
//   amxac_punish_ban_cmd "amx_ban %time% #%userid% %reason%"
amxac_punish_ban_cmd     ""
// Бан для того, кто вышел с сервера, пока бан ждал своего часа (тут нельзя %userid%).
// Пусто = обычный бан сервера по SteamID/IP.
amxac_punish_offline_cmd ""
// Своя команда кика. Пусто = обычный kick.
amxac_punish_kick_cmd    ""


// -----------------------------------------------------------------------------
//  2. УРОВНИ И ОЧКИ
// -----------------------------------------------------------------------------

amxac_warn          30      // очков до WARN
amxac_alert         60      // очков до ALERT (админам приходит сообщение в чат)
amxac_action        100     // очков до ACTION
amxac_halflife      120     // за сколько СЕКУНД очки сгорают наполовину

amxac_admin_flag     "d"    // какие админы получают уведомления в чат
amxac_immunity_flag  ""     // кого вообще не проверять ("" = проверять всех, даже админов)
amxac_notify_reports 0      // 1 = присылать админам КАЖДОЕ подозрение (удобно при настройке)
amxac_log            1      // 1 = писать всё в logs/amxac_ГГГГММДД.log
amxac_include_bots   0      // 1 = проверять и ботов (только для тестов)
amxac_debug          0      // 1 = писать в консоль игрока, почему детектор сработал или нет (только игрокам с флагом rcon; для тестов)

// Старый способ наказания: одна команда на уровне ACTION.
// Если используешь amxac_punish_* выше, оставь пустым, иначе сработает дважды.
amxac_action_cmd    ""


// -----------------------------------------------------------------------------
//  3. ЗАЩИТА ОТ ВХ И NO-FLASH
// -----------------------------------------------------------------------------
//  Не ловит, а мешает: сервер просто не сообщает игроку, где враги за стенами.

amxac_awh_enabled   1       // 1 = не показывать врагов за стенами (защита от WH, радара)
amxac_awh_flash     1       // 1 = не показывать врагов, пока игрок ослеплён флешкой
amxac_awh_teammates 0       // 1 = прятать за стенами и своих тоже

// Нагрузка на процессор. Если сервер начинает лагать — увеличь interval до 0.15–0.2.
amxac_awh_interval      0.1     // как часто перепроверять видимость (секунды)
amxac_awh_grace         0.3     // сколько ещё показывать врага после того, как он скрылся (секунды)
amxac_awh_max_latency   0.25    // поправка на пинг, не больше (секунды)
amxac_awh_traces        20000   // лимит проверок в секунду на весь сервер


// -----------------------------------------------------------------------------
//  4. ДОСТУП НА СЕРВЕР
// -----------------------------------------------------------------------------

amxac_misc_dup_steamid    1     // 1 = кикать второго игрока с таким же SteamID (эмуляторы)
amxac_misc_blocked_reason "Your IP is blocked on this server"   // текст кика для IP из чёрного списка
// Сам чёрный список — файл amxac_blocked_ips.ini, или команды
//   amx_ac_blockip 1.2.3.4   /   amx_ac_blockip 1.2.3.0/24   /   amx_ac_unblockip ...

amxac_misc_max_per_ip     3     // сколько игроков с одного IP — нормально (0 = не проверять)


// -----------------------------------------------------------------------------
//  5. ВКЛЮЧЕНИЕ И ВЫКЛЮЧЕНИЕ ДЕТЕКТОРОВ
// -----------------------------------------------------------------------------
//  1.0 = обычно,  0 = выключить,  0.5 = вдвое меньше очков,  2.0 = вдвое больше.

// Аим
amxac_w_silentaim   1.0     // silent aim (пуля летит во врага, а прицел нет)
amxac_w_aimsnap     1.0     // резкий рывок прицела в голову
amxac_w_trigger     1.0     // триггербот (сам стреляет, когда враг под прицелом)
amxac_w_tracking    1.0     // ведение врага сквозь стену, «прилипший» прицел, % хедшотов
amxac_w_nospread    1.0     // нет разброса
amxac_w_norecoil    1.0     // нет отдачи
amxac_w_knifebot    1.0     // сам бьёт ножом
amxac_w_fastzoom    1.0     // скрипт быстрого зума на снайперке
amxac_w_rapidfire   1.0     // автокликер на пистолете
amxac_w_noflash     1.0     // попадает, будучи ослеплённым

// Движение
amxac_w_bhop        1.0     // бхоп-скрипт.  ПОСТАВЬ 0, если на сервере есть autobhop!
amxac_w_sgs         1.0     // SGS / скрипт даблдака (идеальные дактапы).  На KZ лучше 0
amxac_w_strafe      1.0     // автострейф и strafe-хелпер
amxac_w_speedhack   1.0     // спидхак
amxac_w_angles      1.0     // anti-aim и спинбот
amxac_w_netcode     1.0     // fakelag (слабый сигнал)
amxac_w_movecheck   1.0     // подделка движения: шаг против нажатой клавиши, скорость выше максимальной

// Прочее
amxac_w_misc        1.0     // частая смена ника, много игроков с одного IP
amxac_w_cvars       1.0     // проверка запрещённых настроек клиента (amxac_cvars.ini)
amxac_w_history     1.0     // очки при заходе тем, кто уже попадался раньше
amxac_w_honeypot    1.0     // ловушка: стреляет или ведёт прицелом невидимого админа (amx_ac_ghost)


// =============================================================================
//  6. ТОНКАЯ НАСТРОЙКА ДЕТЕКТОРОВ
// =============================================================================
//  Менять, только если какой-то детектор ловит честных игроков (поднять порог)
//  или ничего не ловит (опустить). *_pts — сколько очков даёт одно срабатывание.
// =============================================================================

// --- silent aim ---
amxac_silent_min_flick   15     // минимальный рывок прицела, градусы
amxac_silent_return_eps  1.0    // насколько точно прицел должен вернуться назад, градусы
amxac_silent_hold_eps    0.5
amxac_silent_max_hold    2      // сколько кадров чит может держать рывок
amxac_silent_pts         25
amxac_silent_raw_attack  1      // 1 = считать выстрелом зажатый +attack (нужно, если стоит Unreal Aim Blocker)

// --- резкий рывок в голову ---
amxac_snap_min   20     // рывок, градусы
amxac_snap_stop  0.3    // насколько прицел должен замереть после, градусы
amxac_snap_pts   5

// --- триггербот ---
amxac_trig_instant_ms    15     // выстрел быстрее стольких мс после появления врага = «мгновенный»
amxac_trig_instant_need  5      // сколько мгновенных из 10 — подозрительно
amxac_trig_max_rt        1000
amxac_trig_max_std       8      // разброс реакции меньше стольких мс = бот с задержкой
amxac_trig_max_mean      400
amxac_trig_pts_instant   20
amxac_trig_pts_const     15

// --- ведение через стену / прилипание / хедшоты ---
amxac_track_fov          3      // насколько близко прицел к врагу, градусы
amxac_track_min_dist     150
amxac_track_wall_ms      600    // сколько мс вести врага за стеной
amxac_track_wall_travel  10
amxac_track_wall_pts     6
amxac_track_wall_err     1.2    // средняя ошибка прицела на враге за стеной должна быть меньше (на слух ведут неточно)
amxac_track_lock_ms      250
amxac_track_lock_travel  15
amxac_track_lock_std     0.25
amxac_track_lock_pts     4
amxac_track_hs_need      17     // хедшотов из последних 20 убийств
amxac_track_hs_pts       8

// --- нет разброса ---
amxac_nospread_min_dev   0.3
amxac_nospread_ratio     0.25
amxac_nospread_need      8      // подозрительных выстрелов из 10
amxac_nospread_pts       20

// --- нет отдачи ---
amxac_norecoil_min_shots 6      // минимум выстрелов в очереди
amxac_norecoil_min_punch 1.0    // отдача должна дойти хотя бы до стольких градусов
amxac_norecoil_max_drift 0.25
amxac_norecoil_pts       12

// --- нож ---
amxac_knife_range        64
amxac_knife_instant_ms   15
amxac_knife_need         7      // мгновенных ударов из 10
amxac_knife_pts          15

// --- быстрый зум ---
amxac_zoom_fast_ms       40     // выстрел быстрее стольких мс после зума
amxac_zoom_need          3      // таких выстрелов из 6
amxac_zoom_pts           12

// --- автокликер ---
amxac_rapid_max_interval 300
amxac_rapid_max_std      2.5    // клики ровнее стольких мс = скрипт
amxac_rapid_pts          10

// --- стрельба вслепую после флешки ---
amxac_flash_need         3      // попаданий за одну флешку
amxac_flash_pts          10

// --- бхоп ---
amxac_bhop_streak        10     // идеальных прыжков подряд
amxac_bhop_clean_streak  6      // идеальных прыжков подряд без нажатий в воздухе
amxac_bhop_ratio         0.8    // доля идеальных из последних 30
amxac_bhop_pts_streak    8
amxac_bhop_pts_clean     15
amxac_bhop_pts_ratio     6

// --- SGS / дактапы (то же, что бхоп, только для приседа) ---
amxac_sgs_streak         10     // идеальных дактапов подряд
amxac_sgs_clean_streak   6      // идеальных дактапов подряд без нажатий приседа в воздухе
amxac_sgs_ratio          0.8    // доля идеальных из последних 30
amxac_sgs_pts_streak     8
amxac_sgs_pts_clean      15
amxac_sgs_pts_ratio      6

// --- макросы на прыжок/присед (AHK и т.п., жмут кнопку по таймеру) ---
// Ловит спам кнопки с постоянным интервалом, не привязанный к приземлению.
// Очки идут в bhop (прыжок) или sgs (присед).
amxac_macro_rate         25     // нажатий в секунду, начиная с которых это «спам»
amxac_macro_seconds      3      // столько секунд подряд
amxac_macro_cv           0.4    // разброс интервалов (0 = идеально ровно); у рук обычно > 0.5
amxac_macro_pts          10

// --- стрейфы ---
amxac_strafe_air_window  200
amxac_strafe_auto_ratio  0.5
amxac_strafe_switch_window 40   // смен A/D на одну проверку хелпера
amxac_strafe_switch_exact  0.9  // доля смен клавиши ровно в кадр разворота мыши (0.9 = 90%); у людей обычно 20-40%
amxac_strafe_pts_auto    15
amxac_strafe_pts_sync    10

// --- спидхак ---
amxac_speed_tolerance    300    // на сколько мс клиент может «убежать» вперёд
amxac_speed_credit       1000
amxac_speed_pts          10
// пустые команды (msec = 0): чит шлёт кадры, которые не тратят время
amxac_zero_streak        3      // столько таких кадров подряд = одна «пачка»
amxac_zero_need          3      // пачек за окно для срабатывания
amxac_zero_window        5      // окно, секунды
amxac_zero_pts           15

// --- подделка движения ---
amxac_move_window        200    // кадров движения на одну проверку
amxac_move_sign_need     3      // кадров «движение против нажатой клавиши» для срабатывания
amxac_move_over_ratio    0.2    // доля кадров со скоростью выше максимальной (0.2 = 20%)
amxac_move_pts_sign      15
amxac_move_pts_over      10

// --- углы и спинбот ---
amxac_angles_max_pitch   89.9
amxac_angles_pts         20
amxac_spin_deg           2000   // поворот, градусов в секунду
amxac_spin_seconds       2      // сколько секунд подряд
amxac_spin_pts           20

// --- fakelag ---
amxac_net_batch          12
amxac_net_need           8
amxac_net_window         10
amxac_net_pts            5
// lag shot: чит «лагает» именно в момент выстрела
amxac_lagshot_window     20     // выстрелов на одну проверку
amxac_lagshot_shot_ratio 0.5    // доля выстрелов в «задушенных» пакетах для срабатывания
amxac_lagshot_cmd_ratio  0.15   // ...при том что остальных кадров в них не больше этой доли
amxac_lagshot_pts        10

// --- ник / IP ---
amxac_misc_names         4      // смен ника
amxac_misc_name_window   10     // за столько секунд
amxac_misc_name_pts      10
amxac_misc_ip_pts        10

// --- проверка настроек клиента ---
amxac_cvars_interval     60     // не чаще раза в столько секунд на игрока
amxac_query_timeout      10     // ждать ответ на запрос квара столько секунд
amxac_query_need         2      // столько запросов без ответа (пока игрок играет) = блокировщик запросов
amxac_query_pts          15
amxac_query_strict       0      // 1 = считать и тех, кто ни разу не ответил (только для серверов без нон-стима: старые клиенты p47 не отвечают вообще)

// --- ловушка «невидимый админ» (amx_ac_ghost) ---
amxac_ghost_track_fov    2.5    // прицел ближе стольких градусов к невидимке = «целится в него»
amxac_ghost_track_ms     700    // столько мс подряд...
amxac_ghost_track_move   64     // ...пока невидимка сдвинулся хотя бы на столько юнитов
amxac_ghost_track_pts    20
amxac_ghost_shot_fov     1.5    // выстрел ближе стольких градусов к невидимке = «стреляет в него»
amxac_ghost_shots_need   3      // таких выстрелов (каждый — новое нажатие, не очередь) для срабатывания
amxac_ghost_shots_window 30     // за столько секунд
amxac_ghost_shot_pts     25

// --- история нарушений ---
amxac_history_pts        5      // очков при заходе за каждое прошлое нарушение
amxac_history_max        25     // но не больше
amxac_history_expire     30     // забывать через столько ДНЕЙ
