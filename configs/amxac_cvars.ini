; AMXAC client cvar rules: <cvar> <op> <value> <points>
; op: =  !=  <=  >=
; Only cvars a normal client cannot change (sv_cheats-protected) belong here,
; otherwise you punish people for their configs.

r_drawentities   =   1     20
gl_wireframe     =   0     20
r_fullbright     =   0     15
lambert          =   1.5   10

; Optional. default_fov other than 90 is a zoom/FOV hack on most builds,
; but some client builds let players change it. Check your players first.
;default_fov      =   90    10
