; AMXAC. The core must be listed first.
amxac_core.amxx

; TEST SERVERS ONLY: fakes cheat behaviour (amx_ac_test). Must stay above aim/move.
;amxac_selftest.amxx

; prevention (wallhack, no-flash), the most CPU-hungry part
amxac_antiwh.amxx

; sound ESP protection, requires ReAPI (remove this line without ReAPI)
amxac_antiesp.amxx

; silentaim aimsnap trigger tracking nospread norecoil knifebot fastzoom rapidfire noflash
amxac_aim.amxx

; bhop sgs strafe speedhack angles netcode movecheck
amxac_move.amxx

; misc cvars history, duplicate SteamID, IP blacklist
amxac_misc.amxx

; levels -> mute / kick / ban
amxac_punish.amxx

; honeypot: amx_ac_ghost makes an admin invisible; whoever hits or tracks him cheats
amxac_ghost.amxx

; Unreal Aim Blocker (ReAPI), if you use it: list it BELOW amxac_aim and
; amxac_move, so AMXAC sees each usercmd before the blocker delays its buttons.
; Don't run UNREAL_ANTI_ESP together with amxac_antiesp, they do the same job.
;aim_blocker.amxx
